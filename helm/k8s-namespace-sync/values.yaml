# Default values for k8s-namespace-sync.
nameOverride: ""
fullnameOverride: ""

# Namespace where the controller will be installed
namespace: k8s-namespace-sync-system

image:
  repository: somaz940/k8s-namespace-sync
  pullPolicy: IfNotPresent
  tag: "v0.4.1"

imagePullSecrets: []

serviceAccount:
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "k8s-namespace-sync-controller-manager"
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

controller:
  metrics:
    bindAddress: ":8443"
  health:
    bindAddress: ":8081"
  leaderElection:
    enabled: true
  logging:
    development: true
    level: "debug"
    encoder: "console"
    stacktraceLevel: "error"
  # Extra environment variables for the controller container
  env: []
  # Example:
  # env:
  #   - name: RECONCILE_INTERVAL
  #     value: "10m"

# Type of the metrics Service (rendered only when metrics.enabled is true).
service:
  type: ClusterIP

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    port: 8081
    path: /healthz
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    port: 8081
    path: /readyz

rbac:
  create: true

# crds/ always installs (opt out with --skip-crds); create+remove only gate the
# pre-delete Job that deletes the CRD, and with it every NamespaceSync.
crds:
  create: true
  remove: true

metrics:
  enabled: true  # Creates the metrics Service; the manager serves /metrics either way.
  service:
    port: 8443
    annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Optional NamespaceSync CRs; ready-made examples in values/{basic,exclude,filter,target}-values.yaml.
customresource:
  basic:
    enabled: false
    name: "namespacesync-basic"
    sourceNamespace: "default"
    configMapName: []  # Example: ["test-configmap"]
    secretName: []     # Example: ["test-secret"]

  exclude:
    enabled: false
    name: "namespacesync-exclude"
    sourceNamespace: "default"
    configMapName: []  # Example: ["test-configmap", "test-configmap2"]
    secretName: []     # Example: ["test-secret", "test-secret2"]
    namespaces: []     # Example: ["test-ns2", "test-ns3"]

  filter:
    enabled: false
    name: "namespacesync-filter"
    sourceNamespace: "default"
    configMapName: []  # Example: ["test-configmap", "test-configmap2"]
    secretName: []     # Example: ["test-secret", "test-secret2"]
    # Globs only narrow configMapName/secretName above; they never discover other resources.
    configMaps:
      include: []      # Example: ["test-configmap*"]
      exclude: []      # Example: ["*2"]
    secrets:
      include: []      # Example: ["test-secret*"]
      exclude: []      # Example: ["*2"]
    exclude: []        # Example: ["test-ns2", "test-ns3"]

  target:
    enabled: false
    name: "namespacesync-target"
    sourceNamespace: "default"
    namespaces: []     # Example: ["test-ns1", "test-ns2"]
    configMapName: []  # Example: ["test-configmap", "test-configmap2"]
    secretName: []     # Example: ["test-secret", "test-secret2"]
