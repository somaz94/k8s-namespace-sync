{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "k8s-namespace-sync.fullname" . }}-test-connection"
  labels:
    {{- include "k8s-namespace-sync.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    # A TCP check, since the metrics endpoint only answers authenticated HTTPS.
    - name: nc
      image: busybox:1.38.0
      command: ['nc']
      args: ['-z', '-w', '5', '{{ include "k8s-namespace-sync.metricsServiceName" . }}.{{ .Values.namespace }}.svc', '{{ .Values.metrics.service.port }}']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  restartPolicy: Never
{{- end }}
