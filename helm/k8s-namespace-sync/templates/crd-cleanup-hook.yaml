{{- if and .Values.crds.create .Values.crds.remove }}
{{- /* The fallbacks cover helm upgrade --reuse-values from a chart that predates these crds.cleanup* values. */}}
{{- $cleanupImage := .Values.crds.cleanupImage | default dict }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-namespace-sync.fullname" . }}-crd-cleanup
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-namespace-sync.fullname" . }}-crd-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["namespacesyncs.sync.nsync.dev"]
    # kubectl delete waits for the CRD to be gone through a list/watch; without them it never returns.
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-namespace-sync.fullname" . }}-crd-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-namespace-sync.fullname" . }}-crd-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-namespace-sync.fullname" . }}-crd-cleanup
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "k8s-namespace-sync.fullname" . }}-crd-cleanup
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "k8s-namespace-sync.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-1"
    # No hook-failed, so a failed pod stays around for kubectl logs.
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      name: {{ include "k8s-namespace-sync.fullname" . }}-crd-cleanup
    spec:
      serviceAccountName: {{ include "k8s-namespace-sync.fullname" . }}-crd-cleanup
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kubectl
        image: "{{ $cleanupImage.repository | default "registry.k8s.io/kubectl" }}:{{ $cleanupImage.tag | default "v1.37.1" }}"
        imagePullPolicy: {{ $cleanupImage.pullPolicy | default "IfNotPresent" }}
        command: ["kubectl"]
        args: ["delete", "crd", "namespacesyncs.sync.nsync.dev", "--ignore-not-found"]
        {{- with .Values.crds.cleanupResources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
  backoffLimit: 1
{{- end }}
